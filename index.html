<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Espaço 344 · Cardápio 80/90</title>
  <!-- Font Awesome para ícones retro -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- QRCode.js para geração de QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      background-image: radial-gradient(circle at 20% 30%, #1a0e2e 0%, #05050f 90%);
      min-height: 100vh;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      color: #f0eaff;
      padding: 18px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-wrapper {
      max-width: 500px;
      width: 100%;
      background: rgba(8, 8, 28, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 48px 48px 32px 32px;
      padding: 22px 18px 30px;
      box-shadow: 0 0 40px rgba(255, 0, 200, 0.25), 0 0 80px rgba(0, 255, 255, 0.1);
      border: 1px solid rgba(255, 100, 200, 0.15);
      position: relative;
    }
    /* linha VHS */
    .vhs-line {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #ff2d95, #ff00c8, #7a2bff, #00d4ff, #ff2d95);
      background-size: 200% 100%;
      border-radius: 20px;
      margin: 12px 0 16px;
      animation: vhsMove 4s linear infinite;
    }
    @keyframes vhsMove { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }
    .memphis-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 6px 0 10px;
    }
    .memphis-dots span {
      display: block;
      width: 10px;
      height: 10px;
      background: #ff44b0;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff44b0;
    }
    .memphis-dots span:nth-child(2) { background: #00e5ff; box-shadow: 0 0 12px #00e5ff; }
    .memphis-dots span:nth-child(3) { background: #b26aff; box-shadow: 0 0 12px #b26aff; }
    .memphis-dots span:nth-child(4) { background: #ffe600; box-shadow: 0 0 12px #ffe600; }

    /* ===== CABEÇALHO ===== */
    .header { text-align: center; padding-bottom: 8px; }
    .logo-neon {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff2d95;
      text-shadow: 0 0 8px #ff2d95, 0 0 20px #ff00a0, 0 0 40px #b3007a, 0 0 80px #6600aa;
      font-family: 'Impact', 'Arial Black', sans-serif;
      line-height: 1.1;
      transform: skewX(-2deg);
    }
    .logo-neon small {
      font-size: 1.1rem;
      display: block;
      color: #00e5ff;
      text-shadow: 0 0 10px #00e5ff, 0 0 30px #0077ff;
      letter-spacing: 3px;
      font-weight: 300;
      text-transform: uppercase;
      margin-top: -4px;
    }
    .subtitle-retro {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      background: rgba(0, 255, 255, 0.1);
      display: inline-block;
      padding: 4px 18px;
      border-radius: 40px;
      border: 1px solid #00e5ff;
      color: #b0f0ff;
      letter-spacing: 1px;
      margin-top: 4px;
      backdrop-filter: blur(2px);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
    }

    /* ===== FILTROS ===== */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 20px 0 18px;
    }
    .filter-btn {
      background: rgba(20, 10, 40, 0.8);
      backdrop-filter: blur(4px);
      border: 1.5px solid #ff44b0;
      color: #ffb0e0;
      padding: 8px 16px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 68, 176, 0.2);
      transition: all 0.15s ease;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      background: #0d0a1f;
      flex: 1 0 auto;
      min-width: 80px;
      text-align: center;
    }
    .filter-btn.active {
      background: #ff44b0;
      color: #0a0a1a;
      box-shadow: 0 0 30px #ff44b0;
      border-color: #ff44b0;
    }
    .filter-btn:active { transform: scale(0.94); }
    .filter-btn[data-cat="Bebidas"] { border-color: #00e5ff; color: #a0f0ff; }
    .filter-btn[data-cat="Bebidas"].active { background: #00e5ff; color: #0a0a1a; box-shadow: 0 0 30px #00e5ff; }
    .filter-btn[data-cat="Drinks Especiais"] { border-color: #ffe600; color: #fff0a0; }
    .filter-btn[data-cat="Drinks Especiais"].active { background: #ffe600; color: #0a0a1a; box-shadow: 0 0 30px #ffe600; }
    .filter-btn[data-cat="Sobremesas"] { border-color: #b26aff; color: #d0b0ff; }
    .filter-btn[data-cat="Sobremesas"].active { background: #b26aff; color: #0a0a1a; box-shadow: 0 0 30px #b26aff; }

    /* ===== LISTA DE PRODUTOS ===== */
    .item-list { display: flex; flex-direction: column; gap: 12px; margin: 6px 0 12px; }
    .menu-item {
      background: rgba(12, 8, 30, 0.7);
      backdrop-filter: blur(2px);
      border-radius: 30px 12px 12px 30px;
      padding: 12px 16px 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.1s ease;
      border-left: 4px solid #ff44b0;
    }
    .menu-item .item-info { display: flex; flex-direction: column; flex: 1; }
    .menu-item .item-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff0fc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .menu-item .item-name .emoji-badge { font-size: 1.0rem; filter: drop-shadow(0 0 4px #ff44b0); }
    .menu-item .item-desc {
      font-size: 0.7rem;
      color: #b0aac8;
      margin-top: 2px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }
    .menu-item .item-price {
      font-weight: 700;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #ff44b0, #b26aff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(255, 68, 176, 0.3);
      padding-left: 12px;
      white-space: nowrap;
      font-family: 'Courier New', monospace;
    }
    .menu-item .tag-retro {
      font-size: 0.55rem;
      background: #ffe600;
      color: #0a0a1a;
      padding: 2px 10px;
      border-radius: 30px;
      font-weight: 700;
      text-transform: uppercase;
      margin-left: 8px;
      box-shadow: 0 0 12px #ffe600;
    }
    .menu-item.drink-item { border-left-color: #00e5ff; }
    .menu-item.drink-item .item-price { background: linear-gradient(135deg, #00e5ff, #7a2bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .menu-item.special-item { border-left-color: #ffe600; }
    .menu-item.special-item .item-price { background: linear-gradient(135deg, #ffe600, #ff8800); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .menu-item.dessert-item { border-left-color: #b26aff; }
    .menu-item.dessert-item .item-price { background: linear-gradient(135deg, #b26aff, #ff44b0); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* ===== RODAPÉ ===== */
    .footer {
      margin-top: 30px;
      padding-top: 20px;
      text-align: center;
      border-top: 2px dashed rgba(255, 68, 176, 0.3);
      color: #b0aad0;
    }
    .footer .welcome-msg { font-size: 1.0rem; color: #f0d0ff; font-weight: 500; text-shadow: 0 0 8px #b26aff; }
    .footer .balcao {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 60px;
      display: inline-block;
      margin: 10px 0 12px;
      border: 1px solid #ff44b0;
      font-size: 0.85rem;
      color: #ffb0e0;
      backdrop-filter: blur(2px);
    }
    .footer .admin-link {
      margin-top: 12px;
      font-size: 0.7rem;
      opacity: 0.4;
      cursor: pointer;
      transition: 0.2s;
      color: #a0a0c0;
      border: none;
      background: none;
      text-decoration: underline dotted;
    }
    .footer .admin-link:hover { opacity: 0.9; color: #ff44b0; }

    /* ===== ADMIN PANEL (overlay) ===== */
    .admin-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }
    .admin-overlay.open { display: flex; }
    .admin-panel {
      max-width: 520px;
      width: 100%;
      background: #12102a;
      border-radius: 40px;
      padding: 24px 22px 30px;
      border: 2px solid #ff44b0;
      box-shadow: 0 0 60px rgba(255, 0, 200, 0.3);
      max-height: 95vh;
      overflow-y: auto;
      position: relative;
    }
    .admin-panel h2 {
      color: #ff44b0;
      text-shadow: 0 0 20px #ff44b0;
      font-family: 'Impact', sans-serif;
      letter-spacing: 2px;
      font-size: 1.8rem;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-panel h2 button {
      background: none;
      border: none;
      color: #ff44b0;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .admin-panel label {
      display: block;
      margin: 10px 0 4px;
      font-weight: 600;
      color: #b0aad0;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .admin-panel input, .admin-panel select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 30px;
      border: 1px solid #3a2a5a;
      background: #1a102f;
      color: #f0eaff;
      font-size: 0.95rem;
      margin-bottom: 6px;
    }
    .admin-panel .btn-admin {
      background: #ff44b0;
      border: none;
      color: #0a0a1a;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 60px;
      width: 100%;
      margin: 12px 0 6px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 68, 176, 0.4);
      transition: 0.15s;
    }
    .admin-panel .btn-admin:active { transform: scale(0.96); }
    .admin-panel .btn-admin.secondary { background: #00e5ff; box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); }
    .admin-list { margin-top: 18px; max-height: 240px; overflow-y: auto; }
    .admin-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a102f;
      padding: 8px 14px;
      border-radius: 30px;
      margin-bottom: 6px;
      border-left: 3px solid #ff44b0;
      font-size: 0.85rem;
    }
    .admin-item .actions button {
      background: none;
      border: none;
      color: #ff44b0;
      margin-left: 8px;
      cursor: pointer;
      font-size: 1.0rem;
    }
    .admin-item .actions button.del { color: #ff4466; }
    .admin-item .actions button.edit { color: #00e5ff; }

    /* ===== QR CODE ===== */
    .qr-area {
      margin: 20px 0 10px;
      text-align: center;
      background: #0a0a1a;
      padding: 20px;
      border-radius: 30px;
      border: 1px solid #ff44b0;
    }
    .qr-area #qrcode { display: flex; justify-content: center; }
    .qr-area .qr-label {
      font-family: 'Courier New', monospace;
      color: #ffb0e0;
      margin-top: 10px;
      font-size: 0.75rem;
    }
    .qr-actions { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
    .qr-actions button {
      background: #ff44b0;
      border: none;
      padding: 8px 18px;
      border-radius: 60px;
      font-weight: 700;
      color: #0a0a1a;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 68, 176, 0.3);
    }
    .qr-actions button.cyan { background: #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 420px) {
      .logo-neon { font-size: 2.2rem; }
      .logo-neon small { font-size: 0.9rem; }
      .filter-btn { font-size: 0.7rem; padding: 6px 10px; min-width: 60px; }
      .menu-item { padding: 10px 12px; }
      .item-price { font-size: 1.0rem; }
    }
    @media (min-width: 600px) {
      body { padding: 30px 20px; }
      .menu-wrapper { padding: 30px 28px; }
    }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body>

<div class="menu-wrapper" id="menuWrapper">
  <!-- cabeçalho -->
  <header class="header">
    <div class="logo-neon">
      ESPAÇO 344
      <small>✦ Flashback 80s & 90s ✦</small>
    </div>
    <div class="subtitle-retro"><i class="fas fa-tape"></i> cardápio neon <i class="fas fa-compact-disc"></i></div>
    <div class="vhs-line"></div>
    <div class="memphis-dots"><span></span><span></span><span></span><span></span></div>
  </header>

  <!-- filtros -->
  <div class="filters" id="filterContainer">
    <button class="filter-btn active" data-cat="Todos">📋 Todos</button>
    <button class="filter-btn" data-cat="Bebidas">🍺 Bebidas</button>
    <button class="filter-btn" data-cat="Salgadinhos">🍿 Salgadinhos</button>
    <button class="filter-btn" data-cat="Drinks Especiais">🍹 Especiais</button>
    <button class="filter-btn" data-cat="Sobremesas">🍦 Sobremesas</button>
  </div>

  <!-- lista de produtos -->
  <div id="productList" class="item-list"></div>

  <!-- rodapé -->
  <footer class="footer">
    <div class="welcome-msg">✨ Bem-vindo(a) ao Espaço 344! ✨</div>
    <div class="balcao">📢 Faça seu pedido diretamente no balcão</div>
    <button class="admin-link" id="openAdminBtn">⚙️ Administrar cardápio</button>
  </footer>
</div>

<!-- ===== ADMIN OVERLAY ===== -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-panel">
    <h2>⚡ ADMIN <button id="closeAdminBtn">&times;</button></h2>
    <div style="margin-bottom:10px; border-bottom:1px solid #3a2a5a; padding-bottom:10px;">
      <label>Nome do Produto</label>
      <input type="text" id="prodName" placeholder="Ex: Coxinha" />
      <label>Categoria</label>
      <select id="prodCategory">
        <option value="Bebidas">Bebidas</option>
        <option value="Salgadinhos">Salgadinhos</option>
        <option value="Drinks Especiais">Drinks Especiais</option>
        <option value="Sobremesas">Sobremesas</option>
      </select>
      <label>Preço (R$)</label>
      <input type="text" id="prodPrice" placeholder="19,90" />
      <label>Descrição curta</label>
      <input type="text" id="prodDesc" placeholder="Ex: frango com catupiry" />
      <label>Tag destaque (opcional)</label>
      <input type="text" id="prodTag" placeholder="Clássico 80s, Mais Vendido" />
      <button class="btn-admin" id="addProductBtn"><i class="fas fa-plus-circle"></i> Adicionar Item</button>
    </div>
    <div>
      <h3 style="color:#b0aad0; font-size:1.0rem; margin-bottom:8px;">📋 Itens cadastrados</h3>
      <div class="admin-list" id="adminList"></div>
    </div>
    <!-- QR Code -->
    <div class="qr-area">
      <div id="qrcode"></div>
      <div class="qr-label">📸 Aponte a câmera para o cardápio digital</div>
      <div class="qr-actions">
        <button class="cyan" id="downloadQrBtn"><i class="fas fa-download"></i> Baixar QR</button>
        <button id="printQrBtn"><i class="fas fa-print"></i> Imprimir plaquinha</button>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ================================================================
    //  DADOS INICIAIS (exemplo)
    // ================================================================
    const defaultProducts = [
      { id: 1, name: "Coca-Cola", category: "Bebidas", price: "8,00", desc: "lata 350ml", tag: "" },
      { id: 2, name: "Coxinha", category: "Salgadinhos", price: "18,00", desc: "6 un. frango c/ catupiry", tag: "Clássico 80s" },
      { id: 3, name: "Blue Lagoon", category: "Drinks Especiais", price: "22,00", desc: "vodka, curaçao, limão", tag: "Mais Vendido" },
      { id: 4, name: "Pudim", category: "Sobremesas", price: "12,00", desc: "pudim de leite com calda", tag: "" },
      { id: 5, name: "Cerveja Artesanal", category: "Bebidas", price: "16,00", desc: "IPA 500ml", tag: "" },
      { id: 6, name: "Batata Frita", category: "Salgadinhos", price: "15,00", desc: "porção média c/ cheddar", tag: "" },
      { id: 7, name: "Mojito", category: "Drinks Especiais", price: "20,00", desc: "rum, hortelã, limão", tag: "Refrescante" },
      { id: 8, name: "Milkshake", category: "Sobremesas", price: "14,00", desc: "morango ou chocolate", tag: "" }
    ];

    // ================================================================
    //  ESTADO
    // ================================================================
    let products = [];
    let currentFilter = 'Todos';
    let editingId = null;

    // ================================================================
    //  LOAD / SAVE
    // ================================================================
    function loadProducts() {
      const stored = localStorage.getItem('espaco344_products');
      if (stored) {
        try { products = JSON.parse(stored); } catch(e) { products = defaultProducts; }
      } else {
        products = defaultProducts;
      }
      // garantir IDs
      if (!products.length) products = defaultProducts;
      saveProducts();
    }
    function saveProducts() {
      localStorage.setItem('espaco344_products', JSON.stringify(products));
    }

    // ================================================================
    //  RENDERIZAÇÃO DO CARDÁPIO (público)
    // ================================================================
    function renderPublic() {
      const container = document.getElementById('productList');
      if (!container) return;
      let filtered = products;
      if (currentFilter !== 'Todos') {
        filtered = products.filter(p => p.category === currentFilter);
      }
      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:30px;color:#888;">Nenhum item nesta categoria 🕺</div>`;
        return;
      }
      container.innerHTML = '';
      filtered.forEach(p => {
        const div = document.createElement('div');
        let cls = 'menu-item';
        if (p.category === 'Bebidas') cls += ' drink-item';
        else if (p.category === 'Drinks Especiais') cls += ' special-item';
        else if (p.category === 'Sobremesas') cls += ' dessert-item';
        div.className = cls;

        const info = document.createElement('div');
        info.className = 'item-info';
        const nameSpan = document.createElement('span');
        nameSpan.className = 'item-name';
        const emoji = document.createElement('span');
        emoji.className = 'emoji-badge';
        if (p.category === 'Bebidas') emoji.textContent = '🍺';
        else if (p.category === 'Salgadinhos') emoji.textContent = '🍟';
        else if (p.category === 'Drinks Especiais') emoji.textContent = '🍹';
        else if (p.category === 'Sobremesas') emoji.textContent = '🍦';
        else emoji.textContent = '📼';
        nameSpan.appendChild(emoji);
        nameSpan.append(' ' + p.name);
        if (p.tag) {
          const tag = document.createElement('span');
          tag.className = 'tag-retro';
          tag.textContent = p.tag;
          nameSpan.appendChild(tag);
        }
        const desc = document.createElement('span');
        desc.className = 'item-desc';
        desc.textContent = p.desc || '';

        info.appendChild(nameSpan);
        info.appendChild(desc);

        const price = document.createElement('span');
        price.className = 'item-price';
        price.textContent = `R$ ${p.price}`;

        div.appendChild(info);
        div.appendChild(price);
        container.appendChild(div);
      });
    }

    // ================================================================
    //  RENDER ADMIN LIST
    // ================================================================
    function renderAdminList() {
      const container = document.getElementById('adminList');
      if (!container) return;
      container.innerHTML = '';
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'admin-item';
        div.innerHTML = `
          <span><strong>${p.name}</strong> (${p.category}) - R$ ${p.price}</span>
          <span class="actions">
            <button class="edit" data-id="${p.id}"><i class="fas fa-pen"></i></button>
            <button class="del" data-id="${p.id}"><i class="fas fa-trash"></i></button>
          </span>
        `;
        container.appendChild(div);
      });
      // eventos
      container.querySelectorAll('.edit').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          const prod = products.find(p => p.id === id);
          if (prod) {
            document.getElementById('prodName').value = prod.name;
            document.getElementById('prodCategory').value = prod.category;
            document.getElementById('prodPrice').value = prod.price;
            document.getElementById('prodDesc').value = prod.desc || '';
            document.getElementById('prodTag').value = prod.tag || '';
            editingId = id;
            document.getElementById('addProductBtn').textContent = '✏️ Atualizar Item';
          }
        });
      });
      container.querySelectorAll('.del').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.dataset.id);
          if (confirm('Remover este item?')) {
            products = products.filter(p => p.id !== id);
            saveProducts();
            renderAdminList();
            renderPublic();
            generateQR();
          }
        });
      });
    }

    // ================================================================
    //  ADMIN FORM
    // ================================================================
    function handleAdminSubmit() {
      const name = document.getElementById('prodName').value.trim();
      const category = document.getElementById('prodCategory').value;
      const price = document.getElementById('prodPrice').value.trim();
      const desc = document.getElementById('prodDesc').value.trim();
      const tag = document.getElementById('prodTag').value.trim();

      if (!name || !price) { alert('Nome e preço são obrigatórios!'); return; }

      if (editingId !== null) {
        // edit
        const idx = products.findIndex(p => p.id === editingId);
        if (idx !== -1) {
          products[idx] = { ...products[idx], name, category, price, desc, tag };
        }
        editingId = null;
        document.getElementById('addProductBtn').textContent = '➕ Adicionar Item';
      } else {
        // add
        const newId = Date.now() + Math.floor(Math.random() * 1000);
        products.push({ id: newId, name, category, price, desc, tag });
      }
      // limpar campos
      document.getElementById('prodName').value = '';
      document.getElementById('prodPrice').value = '';
      document.getElementById('prodDesc').value = '';
      document.getElementById('prodTag').value = '';
      saveProducts();
      renderAdminList();
      renderPublic();
      generateQR();
    }

    // ================================================================
    //  QR CODE
    // ================================================================
    let qrInstance = null;
    function generateQR() {
      const url = window.location.href.split('?')[0].split('#')[0];
      const container = document.getElementById('qrcode');
      if (!container) return;
      container.innerHTML = '';
      try {
        qrInstance = new QRCode(container, {
          text: url,
          width: 180,
          height: 180,
          colorDark: '#ff44b0',
          colorLight: '#0a0a1a',
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch(e) {
        container.innerHTML = '<p style="color:#ff44b0;">QR Code indisponível</p>';
      }
    }

    function downloadQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) { alert('Gere o QR Code primeiro!'); return; }
      const link = document.createElement('a');
      link.download = 'qr_espaco344.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function printQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) { alert('Gere o QR Code primeiro!'); return; }
      const win = window.open('', '_blank');
      if (!win) { alert('Permita popups para imprimir.'); return; }
      const imgData = canvas.toDataURL('image/png');
      win.document.write(`
        <html><head><title>Plaquinha Espaço 344</title>
